# DevSecOps pipeline: every push and pull request is verified, audited,
# secret-scanned and statically analysed before it can reach production.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly re-scan: new advisories appear without code changes

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · i18n · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Vercel's function loader can't require() ES modules. Node can emulate that
      # with --no-experimental-require-module, so run the built site that way and
      # smoke-test it: a dependency that needs require(ESM) fails here, not in production.
      - name: smoke test (Vercel-like runtime, require(ESM) disabled)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export FORM_TOKEN_SECRET="$(openssl rand -hex 32)"
          node --no-experimental-require-module node_modules/next/dist/bin/next start -p 3123 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3123/ && break; sleep 1; done
          node scripts/smoke-test.mjs http://localhost:3123 || { echo "--- server log ---"; tail -50 server.log; exit 1; }
          if grep -q ERR_REQUIRE_ESM server.log; then echo "require(ESM) crash in server log"; grep -m3 ERR_REQUIRE_ESM server.log; exit 1; fi

  dependencies:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # gate: anything shipped to production must have no high/critical advisories
      - run: npm audit --omit=dev --audit-level=high
      # informational: dev tooling (linters, build helpers) never reaches visitors
      - run: npm audit --audit-level=high
        continue-on-error: true

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
